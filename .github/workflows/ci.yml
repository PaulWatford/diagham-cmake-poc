name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: has the canonical DiagHam Subversion trunk moved past the
  # revision this repository carries? (see job upstream-drift)
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every module, no optional libraries: the configuration the
          # physics goldens are pinned against.
          - preset: default
            compiler: gcc
          # LAPACK, GSL, GMP, FFTW3, bzip2 all on.
          - preset: full
            compiler: gcc
          # MPI + ScaLAPACK + LAPACK + GSL (OpenMPI).
          - preset: hpc
            compiler: gcc
          # Core-only scope, with clang, to catch GCC-only assumptions.
          - preset: core
            compiler: clang
    env:
      CMAKE_GENERATOR: Ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache clang python3-numpy \
            liblapack-dev libblas-dev libgsl-dev libgmp-dev libfftw3-dev libbz2-dev \
            libopenmpi-dev openmpi-bin libscalapack-openmpi-dev

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"   >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-${{ matrix.compiler }}-

      - name: Build and test
        run: scripts_cmake/ci.sh ${{ matrix.preset }}

      - name: Keep the environment record and the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-and-ctest-log-${{ matrix.preset }}-${{ matrix.compiler }}
          path: |
            build/${{ matrix.preset }}/environment.txt
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 90

  # The container recipe is verified end to end here: the build stage runs the
  # whole ctest suite, so a failing test fails the image build.
  container:
    if: github.event_name != 'schedule'
    name: container (Dockerfile, full preset)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (compiles, tests, installs)
        run: docker build --build-arg JOBS=4 -t diagham -f container/Dockerfile .
      - name: Run a program from the runtime image
        run: |
          docker run --rm diagham FQHESphereFermionsTwoBodyGeneric --help | head -3
          docker run --rm diagham cat /opt/diagham/environment.txt | head -20

  # The canonical DiagHam lives in Subversion at nick-ux.org. This job reports
  # whether trunk has moved past the revision recorded in
  # scripts_cmake/upstream-revision.txt and, if so, opens (or refreshes) an
  # issue labelled upstream-drift. Bringing revisions in is a deliberate step:
  # scripts_cmake/sync_upstream.sh, run by a person, reviewed as a pull request
  # (docs/how-to/develop/sync-upstream.md).
  upstream-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: upstream drift (SVN trunk)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends subversion
      - name: Compare trunk HEAD with the recorded revision
        id: drift
        run: |
          recorded=$(tr -dc 0-9 < scripts_cmake/upstream-revision.txt)
          head=$(svn info --show-item revision --non-interactive \
                   --trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other \
                   https://www.nick-ux.org/diagham/svn/DiagHam/trunk)
          echo "recorded r$recorded, upstream trunk r$head"
          echo "recorded=$recorded" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" -gt "$recorded" ]; then
            svn log --non-interactive --trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other \
              -r "$((recorded + 1)):$head" https://www.nick-ux.org/diagham/svn/DiagHam/trunk > drift.log || true
            echo "drift=yes" >> "$GITHUB_OUTPUT"
          else
            echo "drift=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or refresh the drift issue
        if: steps.drift.outputs.drift == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="DiagHam trunk is at r${{ steps.drift.outputs.head }}; this repository carries r${{ steps.drift.outputs.recorded }}"
          body=$(printf 'The weekly check found new Subversion revisions.\n\nBring them in with `scripts_cmake/sync_upstream.sh` (see docs/how-to/develop/sync-upstream.md) and open a pull request.\n\n```\n%s\n```\n' "$(head -c 60000 drift.log)")
          existing=$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            gh label create upstream-drift --description "new DiagHam Subversion revisions to bring in" --color 0E8A16 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label upstream-drift
          fi
      - name: Report
        if: steps.drift.outputs.drift == 'yes'
        run: echo "::warning::DiagHam trunk is at r${{ steps.drift.outputs.head }}; this repository carries r${{ steps.drift.outputs.recorded }}"
