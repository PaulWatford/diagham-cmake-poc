# GitLab CI for the planned Kent GitLab home (docs/explanation/migration-history.md).
# Runs the same scripts_cmake/ci.sh as the GitHub workflow, in place: the
# DiagHam sources are part of this repository.

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        ca-certificates git cmake ninja-build g++ clang python3 python3-numpy
        liblapack-dev libblas-dev libgsl-dev libgmp-dev libfftw3-dev libbz2-dev
        libopenmpi-dev openmpi-bin libscalapack-openmpi-dev

variables:
  CMAKE_GENERATOR: Ninja

build-and-test:
  parallel:
    matrix:
      - PRESET: [default, full, hpc, core]
  script:
    - scripts_cmake/ci.sh "$PRESET"
  artifacts:
    when: on_failure
    paths:
      - build/$PRESET/Testing/Temporary/LastTest.log
