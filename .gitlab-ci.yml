# GitLab CI for the GitLab home (docs/how-to/develop/move-to-gitlab.md).
# The same jobs as the GitHub workflows (.github/workflows/ci.yml and pages.yml).
# Both hosts call scripts_cmake/ci.sh, in place (the DiagHam sources are part of
# this repository), so moving hosts changes nothing about what is tested.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - docs

variables:
  CMAKE_GENERATOR: Ninja
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: $CI_PROJECT_DIR/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

.ubuntu:
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        ca-certificates git cmake ninja-build ccache g++ clang python3 python3-numpy
        liblapack-dev libblas-dev libgsl-dev libgmp-dev libfftw3-dev libbz2-dev
        libopenmpi-dev openmpi-bin libscalapack-openmpi-dev

# The five presets of the GitHub matrix: every module with no optional library
# (the configuration the goldens are pinned against), all libraries, MPI and
# ScaLAPACK, the core-only scope with clang, and the core programs.
build-and-test:
  extends: .ubuntu
  stage: test
  interruptible: true
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  parallel:
    matrix:
      - PRESET: [default, full, hpc, core-programs]
        COMPILER: gcc
      - PRESET: core
        COMPILER: clang
  script:
    - if [ "$COMPILER" = clang ]; then export CC=clang CXX=clang++; fi
    - scripts_cmake/ci.sh "$PRESET"
  cache:
    key: ccache-$PRESET-$COMPILER
    paths:
      - .ccache
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - build/$PRESET/environment.txt
      - build/$PRESET/Testing/Temporary/LastTest.log

# The container recipe, end to end: the image build runs the whole ctest suite.
# Needs a runner that allows Docker-in-Docker; switch it on with the project
# variable DIAGHAM_CONTAINER_JOB = 1 once such a runner exists.
container:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $DIAGHAM_CONTAINER_JOB == "1"
  script:
    - docker build --build-arg JOBS=4 -t diagham -f container/Dockerfile .
    - docker run --rm diagham FQHESphereFermionsTwoBodyGeneric --help | head -3
    - docker run --rm diagham cat /opt/diagham/environment.txt | head -20

# Weekly (a pipeline schedule): has the canonical DiagHam Subversion trunk moved
# past the revision this repository carries? The job fails, as a warning, when
# it has; bringing revisions in is a deliberate step, scripts_cmake/sync_upstream.sh
# run by a person and reviewed as a merge request (docs/how-to/develop/sync-upstream.md).
upstream-drift:
  stage: test
  image: ubuntu:24.04
  timeout: 10m
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates subversion
    - |
      svnopt="--non-interactive --trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other"
      trunk=https://www.nick-ux.org/diagham/svn/DiagHam/trunk
      recorded=$(tr -dc 0-9 < scripts_cmake/upstream-revision.txt)
      head=$(svn info --show-item revision $svnopt "$trunk")
      echo "recorded r$recorded, upstream trunk r$head"
      if [ "$head" -gt "$recorded" ]; then
        svn log $svnopt -r "$((recorded + 1)):$head" "$trunk" || true
        echo "DiagHam trunk is at r$head; this repository carries r$recorded. Bring them in with scripts_cmake/sync_upstream.sh."
        exit 1
      fi

# Documentation site (Material for MkDocs, strict: a broken link fails the job).
.mkdocs:
  image: python:3.12-slim
  stage: docs
  before_script:
    - pip install "mkdocs-material==9.*"
  script:
    - python3 scripts_cmake/gen_mkdocs_nav.py --check
    - mkdocs build --strict

# Merge requests that touch the docs: build only.
docs-check:
  extends: .mkdocs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - mkdocs.yml
        - scripts_cmake/gen_mkdocs_nav.py
        - .gitlab-ci.yml

# The default branch: build and publish to GitLab Pages.
pages:
  extends: .mkdocs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  script:
    - python3 scripts_cmake/gen_mkdocs_nav.py --check
    - mkdocs build --strict
    - rm -rf public && mv build/site public
  artifacts:
    paths:
      - public
