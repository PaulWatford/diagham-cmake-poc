# The docs/ knowledge base as a site (Material for MkDocs), published to GitHub Pages by
# .github/workflows/pages.yml on every push to main and built with --strict by CI.
# The nav below is generated: python3 scripts_cmake/gen_mkdocs_nav.py
site_name: DiagHam — CMake migration
site_description: Build, test and documentation set for the DiagHam exact-diagonalization toolkit (SVN r4493)
site_url: https://paulwatford.github.io/diagham-cmake-poc/
repo_url: https://github.com/PaulWatford/diagham-cmake-poc
repo_name: PaulWatford/diagham-cmake-poc
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site
strict: false

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# the generated program pages (700+) are reachable from the index and search, not listed
not_in_nav: |
  /reference/programs/*/*.md
  /drafts/manual-stubs/*.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

